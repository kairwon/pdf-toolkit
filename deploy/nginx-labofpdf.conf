# Merge these directives into the existing HTTPS server block for labofpdf.com.
# Test with `nginx -t` before reloading Nginx.

root /var/www/labofpdf;
index index.html;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' data: blob: https://cloudflareinsights.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

location ~* \.(?:js|mjs|css|woff2|png|jpg|jpeg|webp|svg|ico)$ {
  try_files $uri =404;
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
}

location = /index.html {
  expires -1;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /edit-pdf {
  return 301 https://labofpdf.com/edit;
}

location = /about {
  return 301 https://labofpdf.com/about/editorial-team;
}

location = /about/ {
  return 301 https://labofpdf.com/about/editorial-team;
}

location /api/ {
  proxy_pass http://127.0.0.1:3001;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
  # Route-specific .html files are produced by scripts/prerender-seo.mjs.
  try_files $uri.html $uri $uri/ =404;
}

error_page 404 /404.html;
